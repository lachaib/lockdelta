---
lockfileVersion: '9.0'

importers:

  .:
    configDependencies: {}
    packageManagerDependencies:
      pnpm:
        specifier: 12.2.1
        version: 12.2.1

packages:

  '@pnpm/exe.darwin-arm64@12.2.1':
    resolution: {integrity: sha512-env1}
    cpu: [arm64]
    os: [darwin]

  '@pnpm/exe.linux-x64@12.2.1':
    resolution: {integrity: sha512-env2}
    cpu: [x64]
    os: [linux]
    libc: [glibc]

  pnpm@12.2.1:
    resolution: {integrity: sha512-env3}
    engines: {node: '>=18.*'}
    hasBin: true

snapshots:

  '@pnpm/exe.darwin-arm64@12.2.1':
    optional: true

  '@pnpm/exe.linux-x64@12.2.1':
    optional: true

  pnpm@12.2.1:
    optionalDependencies:
      '@pnpm/exe.darwin-arm64': 12.2.1
      '@pnpm/exe.linux-x64': 12.2.1

---
